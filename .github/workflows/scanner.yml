name: WhaleFlow Scanner

on:
  schedule:
    - cron: '*/15 * * * *'  # Her 15 dakikada bir otomatik çalışır
  workflow_dispatch:        # Elle çalıştır butonu

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Kur
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy

      - name: Taramayı Başlat
        run: python main.py
